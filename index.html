<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>33</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c310b;
      --text: #f5f9d2;
      --note: #9ab1a0;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      scrollbar-width: none;          /* hide scrollbar (Firefox) */
      -ms-overflow-style: none;       /* hide scrollbar (old Edge) */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar { display: none; }  /* hide scrollbar (Chrome, Safari) */
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 24px;
      text-align: center;
    }
    main { width: 100%; max-width: 520px; }
    #ref {
      font-size: 14px;
      font-weight: 500;
      color: var(--note);
      margin: 0 0 20px;
    }
    #verse {
      font-size: 18px;
      line-height: 1.35;
      margin: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    #note {
      font-size: 14px;
      color: var(--note);
      margin: 28px auto 0;
      max-width: 400px;
      line-height: 1.2;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    #note:empty { display: none; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 36px;
    }
    .btn {
      font: 500 0.95rem "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background: none;
      border: 1px solid var(--note);
      border-radius: 999px;
      padding: 11px 20px;
      text-decoration: none;
    }
    .btn:hover { background: rgba(245, 249, 210, 0.08); }
    .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    footer {
      margin-top: 40px;
      max-width: 480px;
      font-size: 0.72rem;
      line-height: 1.5;
      color: var(--note);
    }
    footer p { margin: 0 0 6px; }
  </style>
</head>
<body>
  <main>
    <p id="ref"></p>
    <p id="verse"></p>
    <p id="note"></p>
    <div class="actions">
      <a class="btn" id="bible" href="#" target="_blank" rel="noopener">Bible app</a>
      <a class="btn" id="tg" href="#" target="_blank" rel="noopener">Tele thoughts</a>
      <a class="btn" id="song" href="#" target="_blank" rel="noopener" hidden>A song</a>
    </div>
  </main>

  <footer>
    <p>Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.</p>
  </footer>

  <script>
    // ============================================================
    // EDIT HERE: replace each text with the ESV verse, and add an
    // optional personal note in your own words (leave "" for none).
    // Use \n for a line break. Keep the "v" numbers matching the
    // real verse numbers in Psalm 27.
    // ============================================================
    const BOOK = "Psalm";
    const BOOK_CODE = "PSA";
    const CHAPTER = 27;

    const VERSES = [
      { v: 1,  text: "The Lord is my light and my salvation; whom shall I fear? The Lord is the stronghold of my life; of whom shall I be afraid?", note: "stronghold; a dwelling place when danger is imminent" song: "https://open.spotify.com/track/4fspEW2gjjhfpx85RYt528?si=8d5592fd658a456c" },
      { v: 2,  text: "When evildoers assail me to eat up my flesh, my adversaries and foes, it is they who stumble and fall.", note: "a big faith while David's enemies threatened to take his life" },
      { v: 3,  text: "Though an army encamp against me, my heart shall not fear; though war arise against me, yet I will be confident.", note: "internal faith is enough to withstand external circumstances" },
      { v: 4,  text: "One thing have I asked of the Lord, that will I seek after: that I may dwell in the house of the Lord all the days of my life, to gaze upon the beauty of the Lord and to inquire in his temple.", note: "dwell with God" },
      { v: 5,  text: "For he will hide me in his shelter in the day of trouble; he will conceal me under the cover of his tent; he will lift me high upon a rock.", note: "the protection of God surrounds us" },
      { v: 6,  text: "And now my head shall be lifted up above my enemies all around me, and I will offer in his tent sacrifices with shouts of joy; I will sing and make melody to the Lord.", note: "to worship God in song" },
      { v: 7,  text: "Hear, O Lord, when I cry aloud; be gracious to me and answer me!", note: "God is always listening to our heart's cry and prayer" },
      { v: 8,  text: "You have said, “Seek my face.” My heart says to you, “Your face, Lord, do I seek.”", note: "constantly turning to Him in everything" },
      { v: 9,  text: "Hide not your face from me. Turn not your servant away in anger, O you who have been my help. Cast me not off; forsake me not, O God of my salvation!", note: "it's by salvation through Christ alone that we can dwell with God" },
      { v: 10, text: "For my father and my mother have forsaken me, but the Lord will take me in.", note: "God embraces each one even when they are not embraced on earth" },
      { v: 11, text: "Teach me your way, O Lord, and lead me on a level path because of my enemies.", note: "more than deliverance; to align to His will and ways" },
      { v: 12, text: "Give me not up to the will of my adversaries; for false witnesses have risen against me, and they breathe out violence.", note: "entrusting his safety and life entirely to God" },
      { v: 13, text: "I believe that I shall look upon the goodness of the Lord in the land of the living!", note: "even in trial, there is hope and joy in Christ" },
      { v: 14, text: "Wait for the Lord; be strong, and let your heart take courage; wait for the Lord!", note: "being with the Lord and communing with Him even in trying times" }
    ];
    // ============================================================

    const YOUVERSION_ESV_ID = 59; // ESV on YouVersion
    const STORE_KEY = "psalm27-bag-v1";

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Shuffle bag: every verse is shown once before any repeats.
    // The bag is remembered in the browser so it carries across taps.
    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY));
        if (s && Array.isArray(s.bag) && s.size === VERSES.length) return s;
      } catch (e) {}
      return { bag: [], last: -1, size: VERSES.length };
    }
    function saveState(s) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
    }

    function nextIndex() {
      const s = loadState();
      s.bag = s.bag.filter(i => i >= 0 && i < VERSES.length);
      if (s.bag.length === 0) {
        let fresh = shuffle(VERSES.map((_, i) => i));
        // Don't start a new round with the verse just shown.
        if (fresh.length > 1 && fresh[0] === s.last) {
          [fresh[0], fresh[1]] = [fresh[1], fresh[0]];
        }
        s.bag = fresh;
      }
      const i = s.bag.shift();
      s.last = i;
      s.size = VERSES.length;
      saveState(s);
      return i;
    }

    function render() {
      const item = VERSES[nextIndex()];
      const refText = BOOK + " " + CHAPTER + ":" + item.v;

      document.getElementById("ref").textContent = refText + " (ESV)";
      document.getElementById("verse").textContent = item.text;
      document.getElementById("note").textContent = item.note || "";

      const bibleUrl = "https://www.bible.com/bible/" + YOUVERSION_ESV_ID + "/" +
        BOOK_CODE + "." + CHAPTER + "." + item.v + ".ESV";
      document.getElementById("bible").href = bibleUrl;

      const shareText = refText + " (ESV)\n" + item.text + "\n\nMy thoughts:\n";
      document.getElementById("tg").href = "https://t.me/share/url?url=" +
        encodeURIComponent(bibleUrl) + "&text=" + encodeURIComponent(shareText);

      const songBtn = document.getElementById("song");
      if (item.song) {songBtn.href = item.song; songBtn.hidden = false;} else {
        songBtn.hidden = true;}};

    render();
  </script>
</body>
</html>
