<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psalm 27</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c310b;
      --text: #f5f9d2;
      --note: #9ab1a0;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      scrollbar-width: none;          /* hide scrollbar (Firefox) */
      -ms-overflow-style: none;       /* hide scrollbar (old Edge) */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar { display: none; }  /* hide scrollbar (Chrome, Safari) */
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 24px;
      text-align: center;
    }
    main { width: 100%; max-width: 520px; }
    #ref {
      font-size: 1rem;
      font-weight: 500;
      color: var(--note);
      margin: 0 0 20px;
    }
    #verse {
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      line-height: 1.5;
      margin: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    #note {
      font-style: italic;
      color: var(--note);
      margin: 28px auto 0;
      max-width: 400px;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    #note:empty { display: none; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 36px;
    }
    .btn {
      font: 500 0.95rem "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background: none;
      border: 1px solid var(--note);
      border-radius: 999px;
      padding: 11px 20px;
      text-decoration: none;
    }
    .btn:hover { background: rgba(245, 249, 210, 0.08); }
    .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    footer {
      margin-top: 40px;
      max-width: 480px;
      font-size: 0.72rem;
      line-height: 1.5;
      color: var(--note);
    }
    footer p { margin: 0 0 6px; }
  </style>
</head>
<body>
  <main>
    <p id="ref"></p>
    <p id="verse"></p>
    <p id="note"></p>
    <div class="actions">
      <a class="btn" id="bible" href="#" target="_blank" rel="noopener">Open in Bible app</a>
      <a class="btn" id="tg" href="#" target="_blank" rel="noopener">Jot down my thoughts</a>
    </div>
  </main>

  <footer>
    <p>Verse picked at random. Grace is deterministic.</p>
    <p>Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.</p>
  </footer>

  <script>
    // ============================================================
    // EDIT HERE: replace each text with the ESV verse, and add an
    // optional personal note in your own words (leave "" for none).
    // Use \n for a line break. Keep the "v" numbers matching the
    // real verse numbers in Psalm 27.
    // ============================================================
    const BOOK = "Psalm";
    const BOOK_CODE = "PSA";
    const CHAPTER = 27;

    const VERSES = [
      { v: 1,  text: "Paste ESV Psalm 27:1 here", note: "lorem ipsum dolor sit amet consectetur adipiscing elit deleniti sint in iusto id similique eiusmod dolores deserunt vel facere eiusmod et incididunt soluta iusto fugiat deserunt eligendi qui nam" },
      { v: 2,  text: "Paste ESV Psalm 27:2 here", note: "lorem ipsum dolor sit amet consectetur adipiscing elit deleniti sint in iusto id similique eiusmod dolores deserunt vel facere eiusmod et incididunt soluta iusto fugiat deserunt eligendi qui nam " },
      { v: 3,  text: "Paste ESV Psalm 27:3 here", note: "lorem ipsum dolor sit amet consectetur adipiscing elit deleniti sint in iusto id similique eiusmod dolores deserunt vel facere eiusmod et incididunt soluta iusto fugiat deserunt eligendi qui nam " },
      { v: 4,  text: "Paste ESV Psalm 27:4 here", note: "lorem ipsum dolor sit amet consectetur adipiscing elit deleniti sint in iusto id similique eiusmod dolores deserunt vel facere eiusmod et incididunt soluta iusto fugiat deserunt eligendi qui nam " },
      { v: 5,  text: "Paste ESV Psalm 27:5 here", note: "lorem ipsum dolor sit amet consectetur adipiscing elit deleniti sint in iusto id similique eiusmod dolores deserunt vel facere eiusmod et incididunt soluta iusto fugiat deserunt eligendi qui nam " },
      { v: 6,  text: "Paste ESV Psalm 27:6 here", note: "lorem ipsum dolor sit amet consectetur adipiscing elit deleniti sint in iusto id similique eiusmod dolores deserunt vel facere eiusmod et incididunt soluta iusto fugiat deserunt eligendi qui nam " },
      { v: 7,  text: "Paste ESV Psalm 27:7 here", note: "lorem ipsum dolor sit amet consectetur adipiscing elit deleniti sint in iusto id similique eiusmod dolores deserunt vel facere eiusmod et incididunt soluta iusto fugiat deserunt eligendi qui nam " },
      { v: 8,  text: "Paste ESV Psalm 27:8 here", note: "" },
      { v: 9,  text: "Paste ESV Psalm 27:9 here", note: "" },
      { v: 10, text: "Paste ESV Psalm 27:10 here", note: "" },
      { v: 11, text: "Paste ESV Psalm 27:11 here", note: "" },
      { v: 12, text: "Paste ESV Psalm 27:12 here", note: "" },
      { v: 13, text: "Paste ESV Psalm 27:13 here", note: "" },
      { v: 14, text: "Paste ESV Psalm 27:14 here", note: "" }
    ];
    // ============================================================

    const YOUVERSION_ESV_ID = 59; // ESV on YouVersion
    const STORE_KEY = "psalm27-bag-v1";

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Shuffle bag: every verse is shown once before any repeats.
    // The bag is remembered in the browser so it carries across taps.
    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY));
        if (s && Array.isArray(s.bag) && s.size === VERSES.length) return s;
      } catch (e) {}
      return { bag: [], last: -1, size: VERSES.length };
    }
    function saveState(s) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
    }

    function nextIndex() {
      const s = loadState();
      s.bag = s.bag.filter(i => i >= 0 && i < VERSES.length);
      if (s.bag.length === 0) {
        let fresh = shuffle(VERSES.map((_, i) => i));
        // Don't start a new round with the verse just shown.
        if (fresh.length > 1 && fresh[0] === s.last) {
          [fresh[0], fresh[1]] = [fresh[1], fresh[0]];
        }
        s.bag = fresh;
      }
      const i = s.bag.shift();
      s.last = i;
      s.size = VERSES.length;
      saveState(s);
      return i;
    }

    function render() {
      const item = VERSES[nextIndex()];
      const refText = BOOK + " " + CHAPTER + ":" + item.v;

      document.getElementById("ref").textContent = refText + " (ESV)";
      document.getElementById("verse").textContent = item.text;
      document.getElementById("note").textContent = item.note || "";

      const bibleUrl = "https://www.bible.com/bible/" + YOUVERSION_ESV_ID + "/" +
        BOOK_CODE + "." + CHAPTER + "." + item.v + ".ESV";
      document.getElementById("bible").href = bibleUrl;

      const shareText = refText + " (ESV)\n" + item.text + "\n\nMy thoughts:\n";
      document.getElementById("tg").href = "https://t.me/share/url?url=" +
        encodeURIComponent(bibleUrl) + "&text=" + encodeURIComponent(shareText);
    }

    render();
  </script>
</body>
</html>
